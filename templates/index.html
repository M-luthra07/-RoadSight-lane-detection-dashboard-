<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lane Detection Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Processing...</div>
    </div>

    <div class="container">
        
        <header>
            <h1>Lane Detection Dashboard</h1>
            <p class="subtitle">Advanced Computer Vision for Autonomous Driving</p>
        </header>

        <!-- IMAGE UPLOAD SECTION -->
        <section class="card">
            <h2>Image Analysis</h2>
            <form action="/upload_image" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
                <input type="file" name="image" accept="image/*" required>
                <button type="submit">Process Image</button>
            </form>

            {% if input_image %}
            <div class="results-grid">
                <div class="result-item">
                    <h3>Original Image</h3>
                    <img src="{{ input_image }}" alt="Input Image">
                </div>
                <div class="result-item">
                    <h3>Detected Lanes</h3>
                    <img src="{{ output_image }}" alt="Output Image">
                </div>
            </div>
            {% endif %}
        </section>

        <!-- VIDEO UPLOAD SECTION -->
        <section class="card">
            <h2>Video Analysis</h2>
            <form action="/upload_video" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
                <input type="file" name="video" accept="video/*" required>
                <button type="submit">Process Video</button>
            </form>

            {% if input_video %}
            <div class="results-grid">
                <div class="result-item">
                    <h3>Original Video</h3>
                    <video controls>
                        <source src="{{ input_video }}" type="video/mp4">
                        Your browser does not support video playback.
                    </video>
                </div>
                <div class="result-item">
                    <h3>Detected Lanes</h3>
                    <video controls>
                        <source src="{{ output_video }}" type="video/mp4">
                        Your browser does not support video playback.
                    </video>
                </div>
            </div>
            {% endif %}
        </section>

    </div>

    <script>
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
    </script>

</body>
</html>
